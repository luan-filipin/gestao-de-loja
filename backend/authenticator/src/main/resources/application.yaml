server:
  port: 8081

spring:
  application:
    name: authenticator

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  liquibase:
    change-log: classpath:db/changelog/changelog-master.xml

jwt:
  private-key: classpath:keys/private.pem
  public-key: classpath:keys/public.pem

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka