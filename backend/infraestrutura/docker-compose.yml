networks:
  gestao-de-loja-network:
    driver: bridge

services:
  postgres-estoque:
    image: ${POSTGRES_IMAGE}
    container_name: postgres-estoque
    hostname: postgres-estoque
    restart: unless-stopped

    ports:
      - "${ESTOQUE_DB_PORT}:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${ESTOQUE_DB}

    volumes:
      - ./postgres-estoque-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - gestao-de-loja-network

  postgres-authenticator:
    image: ${POSTGRES_IMAGE}
    container_name: postgres-authenticator
    hostname: postgres-authenticator
    restart: unless-stopped

    ports:
      - "${AUTHENTICATOR_DB_PORT}:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTHENTICATOR_DB}

    volumes:
      - ./postgres-authenticator-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - gestao-de-loja-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - gestao-de-loja-network